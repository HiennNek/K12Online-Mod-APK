name: build

# Manual run: Actions -> build -> Run workflow.
# Each run publishes a release (tag input, or v2.2.2-<run number>) with both
# files attached, and keeps them as artifacts for 7 days.
# Needs the repo secret KEYSTORE_B64 = base64 -w0 .build/k12.keystore
# (the keystore password is in port/build.sh). The original XAPK comes from a
# release asset because APKPure blocks GitHub runner IPs (Cloudflare 403).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = v2.2.2-<run number>)"
        required: false

env:
  APP_VERSION: "299"          # versionCode of the original XAPK to build from
  XAPK_URL: https://github.com/HiennNek/storage/releases/download/k/K12Online_2.2.2.xapk
  XAPK: K12Online_2.2.2_APKPure.xapk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # create the release and upload its assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install apktool
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          printf '#!/bin/sh\nexec java -jar "%s/apktool.jar" "$@"\n' "$RUNNER_TEMP/bin" \
            > "$RUNNER_TEMP/bin/apktool"
          chmod +x "$RUNNER_TEMP/bin/apktool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$(ls -d "$SDK"/platforms/* | sort -V | tail -1)/android.jar" >> "$GITHUB_ENV"

      - name: Cache original XAPK
        id: xapk
        uses: actions/cache@v4
        with:
          path: ${{ env.XAPK }}
          key: xapk-vn.viettelstudy.k12-${{ env.APP_VERSION }}

      - name: Download original XAPK
        if: steps.xapk.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 --retry-delay 5 -o "$XAPK" "$XAPK_URL"

      - name: Unpack original splits
        run: |
          unzip -o "$XAPK" vn.viettelstudy.k12.apk config.arm64_v8a.apk \
            config.en.apk config.xxhdpi.apk icon.png manifest.json

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p .build
          printf '%s' "$KEYSTORE_B64" | base64 -d > .build/k12.keystore

      - name: Parser self-check
        run: node port/test.js

      - name: Build
        run: ./port/build.sh --merge

      - name: Checksums
        run: sha256sum K12Online_2.2.2_hacked.apk K12Online_2.2.2_hacked.xapk

      - uses: actions/upload-artifact@v4
        with:
          name: K12Online_2.2.2_hacked.apk
          path: K12Online_2.2.2_hacked.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: K12Online_2.2.2_hacked.xapk
          path: K12Online_2.2.2_hacked.xapk
          retention-days: 7

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || format('v2.2.2-{0}', github.run_number) }}
        run: |
          gh release create "$TAG" \
            K12Online_2.2.2_hacked.apk \
            K12Online_2.2.2_hacked.xapk \
            --title "K12Online 2.2.2 ($TAG)" \
            --notes "Automated build from $GITHUB_SHA."
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
